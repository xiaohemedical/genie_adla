[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "genie-adla"
version = "0.1.0"
description = "Deep learning for binary classification from high-dimensional DNA methylation data."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
    "joblib>=1.3",
    "numpy>=1.24",
    "pandas>=2.0",
    "PyYAML>=6.0",
    "scikit-learn>=1.3",
    "torch>=2.0",
]

[project.scripts]
genie-adla-train = "genie_adla.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
